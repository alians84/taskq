name: taskq

x-taskq: &taskq
  build: .
  image: taskq:dev
  environment:
    DATABASE_URL: postgres://taskq:taskq@postgres:5432/taskq?sslmode=disable
    LOG_LEVEL: info

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: taskq
      POSTGRES_PASSWORD: taskq
      POSTGRES_DB: taskq
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskq -d taskq"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    <<: *taskq
    command: ["migrate", "up"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *taskq
    command: ["api"]
    ports:
      - "8080:8080"
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *taskq
    command: ["worker"]
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

volumes:
  pgdata:
