global:
  scrape_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8080"]

  # Every worker replica is discovered through Docker's DNS for the service name.
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9090
        refresh_interval: 5s
